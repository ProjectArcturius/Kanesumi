[workspace]
members = [
    "kanesumi-core",
    "kanesumi-anim",
    "kanesumi-structure",
    "kanesumi-controls",
    "kanesumi-harness",
    "kanesumi-gallery",
]
resolver = "2"

# 各 crate manifest 自包含（显式 version/edition/license/authors），
# 便于被 Ether monorepo 以 [patch] 作为 path 依赖消费（跨 workspace 时 X.workspace = true 解析失败）。

# kanesumi-anim 以 git 依赖声明 sokuou（GuitaristRin/Sokuou）——Kanesumi 仓独立可建。
# Ether monorepo 侧在根 Cargo.toml 用 [patch."https://github.com/GuitaristRin/Sokuou"]
# 将 sokuou 统一收敛到本地 submodule（shared/sokuou）。参 Ether-main PLAN.md §6.3。
